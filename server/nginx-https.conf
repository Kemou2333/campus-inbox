# Only APK requests use these zones; accounts, AI and private paths are unaffected.
limit_conn_zone $binary_remote_addr zone=campus_apk_per_ip:1m;
limit_conn_zone $server_name zone=campus_apk_per_site:1m;
server {
    listen 80;
    server_name 123.57.30.129;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/campus-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://123.57.30.129$request_uri; }
}
server {
    listen 443 ssl;
    server_name 123.57.30.129;
    ssl_certificate /etc/letsencrypt/live/123.57.30.129/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.57.30.129/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusTLS:1m;
    client_max_body_size 64k;
    client_body_timeout 15s;
    access_log off;
    add_header Strict-Transport-Security "max-age=2592000" always;
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /analyze {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 195s;
        proxy_send_timeout 15s;
    }
    location = /notice-question {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 195s;
        proxy_send_timeout 15s;
    }
    location ^~ /analysis-jobs {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location ^~ /site-transfer {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }
    location ^~ /admin {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location ^~ /sync {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    # APK verification and streaming have a separate bounded quota, never an open static alias.
    location ^~ /downloads/ {
        access_log off;
        error_log /dev/null crit;
        limit_conn campus_apk_per_ip 1;
        limit_conn campus_apk_per_site 8;
        limit_conn_status 429;
        error_page 429 = @campus_apk_busy;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
    }
    location @campus_apk_busy {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 429 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载暂时繁忙</title><body><h1>请稍后再下载</h1><p>同一网络同时只能进行一次下载，完成后可重试。</p><p><a href="https://github.com/Kemou2333/note-inbox/releases/latest" rel="noopener noreferrer">查看GitHub备用下载</a></p></body></html>';
    }
    # Static UI is independent from the API and persistent account data.
    root /var/www/campus-inbox-site/current;
    index index.html;
    location ^~ /assets/ {
        root /var/www/campus-inbox-site/shared;
        expires 1y;
        try_files $uri =404;
    }
    location = /admin-preview.html {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
