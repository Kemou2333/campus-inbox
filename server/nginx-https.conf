server {
    listen 80;
    server_name 123.57.30.129;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/campus-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://123.57.30.129$request_uri; }
}
server {
    listen 443 ssl;
    server_name 123.57.30.129;
    ssl_certificate /etc/letsencrypt/live/123.57.30.129/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.57.30.129/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusTLS:1m;
    client_max_body_size 64k;
    client_body_timeout 15s;
    access_log off;
    add_header Strict-Transport-Security "max-age=2592000" always;
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /analyze {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 195s;
        proxy_send_timeout 15s;
    }
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }
    location ^~ /sync {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
